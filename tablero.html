<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla de posiciones · Búsqueda del Tesoro AR · LDCV</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <style>
    body { padding: 32px 48px; }
    #app { max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; font-size: 1.4rem; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--azul-claro); }
    th { color: var(--ambar); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
    td.pos { font-weight: 700; width: 3ch; color: var(--ambar); }
    td.pts { font-weight: 700; text-align: right; }
    tr.top1 td { font-size: 1.7rem; }
    .pill { display:inline-block; padding: 2px 10px; border-radius: 999px; background: var(--azul-claro); font-size: .9rem; }
    .pill.fin { background: var(--ok); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/src/tablero.js"></script>
</body>
</html>
